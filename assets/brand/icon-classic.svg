    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC15E"/><stop offset="1" stop-color="#E8762C"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
