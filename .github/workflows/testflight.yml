# TEMPLATE, untested on a clean runner (a clean macOS runner may need more than this file has).
# Before using it you need:
#   1. A GitHub remote for your fork.
#   2. Signing is fastlane match (readonly) from a PRIVATE certs repo; run `scripts/testflight.sh certs` once locally first.
#   3. Repository secrets: SANGEET_BUNDLE_ID, APPLE_TEAM, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT (base64 of the .p8),
#      MATCH_GIT_URL (https URL of the certs repo), MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION (base64 of "user:token"
#      with read access to the certs repo; or use a deploy key with an ssh MATCH_GIT_URL), optional BETA_FEEDBACK_EMAIL.
# Runs on a manual dispatch or when a v* tag is pushed. The beta lane runs the gates (tsc, eslint, jest) before building.
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SANGEET_FREE_TEAM: '0'
      SANGEET_CARPLAY: '0' # 1 once Apple approves the CarPlay entitlement
      SANGEET_BUNDLE_ID: ${{ secrets.SANGEET_BUNDLE_ID }}
      SANGEET_APPLE_TEAM: ${{ secrets.APPLE_TEAM }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APPLE_TEAM: ${{ secrets.APPLE_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the What to Test changelog reads commit history and testflight/* tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - run: npx expo prebuild -p ios
      # Signing (match, readonly) runs inside the lane: setup_ci creates a temporary keychain on this runner.
      - run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-build
          path: |
            build/testflight/changelog.txt
            build-number.txt
