# Type check, lint and unit tests on every pull request and every push to main, plus a changeset reminder on pull
# requests. No secrets, nothing is built or published, so it is safe for pull requests from forks.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # node_modules as installed (postinstall patches applied), reused only for the exact lockfile, patches and Node
      # version; on a miss npm ci installs from scratch and the result is saved.
      - id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node26-${{ hashFiles('package-lock.json', 'patches/**') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # tsc, eslint and jest caches. They only skip work for unchanged files, so a stale one is harmless; a new copy is
      # saved on every run and the closest earlier one restored.
      - uses: actions/cache@v6
        with:
          path: |
            .tsbuildinfo
            .eslintcache
            ${{ runner.temp }}/jest-cache
          key: tool-caches-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tool-caches-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            tool-caches-${{ runner.os }}-
      - run: npx tsc --noEmit --incremental --tsBuildInfoFile .tsbuildinfo
      - run: npx eslint --cache --cache-location .eslintcache --cache-strategy content src app
      - run: npx jest --ci --cacheDirectory "$RUNNER_TEMP/jest-cache"

  # A warning, never a failure: refactors, tests and docs need no changeset.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base
      - name: Changeset for app changes
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          app=$(echo "$changed" | grep -E '^(app|src|modules|plugins|patches)/|^app\.config\.ts$' | grep -v -E '\.test\.tsx?$' || true)
          added=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- .changeset | grep -E '^\.changeset/.+\.md$' | grep -v README.md || true)
          if [ -n "$app" ] && [ -z "$added" ]; then
            msg="This PR changes app code but adds no changeset. If testers will notice the change, add one: npx changeset (see .changeset/README.md)."
            echo "::warning::$msg"
            { echo "### Changeset"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$added" ]; then
            { echo "### Changeset"; echo "$added" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
