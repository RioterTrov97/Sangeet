# Keeps one release PR up to date. Every push to main that leaves changesets pending (.changeset/*.md) rebuilds the
# branch changeset-release/main from main (version bump in package.json, CHANGELOG.md entry, changesets consumed) and
# opens or updates the "Release vX.Y.Z" PR, so the PR grows as features land. It never builds, signs or publishes:
# merging that PR is what starts the Release workflow.
#
# Needs Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests".
# PRs opened with the workflow token do not run the Checks workflow; Release runs the same checks before building.
name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version
  cancel-in-progress: true # only the newest main matters

env:
  BRANCH: changeset-release/main

jobs:
  version:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets reads history to link each entry to its commit

      - name: Pending changesets
        id: pending
        run: |
          n=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = 0 ]; then
            echo "::notice::No pending changesets: no release PR needed."
            # Nothing left to release (the release PR was just merged, or its changesets were removed).
            pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
            [ -z "$pr" ] || gh pr close "$pr" --comment "No pending changesets on main any more." --delete-branch
          fi

      # If the last release PR was merged but its Release run failed, main holds a version that has no tag. Bumping past
      # it would skip that version for good, so stop (red X on main) until it is released by hand.
      - name: Last version released
        if: steps.pending.outputs.count != '0'
        run: |
          v=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin 'refs/tags/v*' >/dev/null && ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            msg="v$v is on main but was never released (its Release run failed or was cancelled). Run Actions > Release by hand on main; the release PR updates again on the next push."
            echo "::error::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
            [ -z "$pr" ] || gh pr comment "$pr" --body "Not updated: $msg"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.count != '0'
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.pending.outputs.count != '0'

      - name: Open or update the release PR
        if: steps.pending.outputs.count != '0'
        run: |
          git switch -C "$BRANCH"
          npm run version-packages
          v=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$v" > "$RUNNER_TEMP/notes.md"
          git config user.name "release-ci" && git config user.email "release-ci@users.noreply.github.com"
          git add -A
          git commit -m "release: v$v"
          git push --force origin "$BRANCH"
          {
            echo "Merging this PR releases **v$v**: the Release workflow builds the iPhone app for testers and the Android APK,"
            echo "then publishes the GitHub Release. It updates itself while more changesets land on main."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Release v$v" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Release v$v" --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "Release PR for v$v: $(gh pr view "$BRANCH" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
